{% extends "base.html" %}

{% block title %}
List of countries
{% endblock title %}

{% block content %}
<h1>countries</h1>
<div class="mb-10">
{% for item in items %}
    <div class="mb-5">
        <div>

            <label><b>{{"name" | capitalize }}:</b> {{item.name}}</label>
            </div>
        <a href="/countries/{{ item.id }}/edit">Edit</a>
        <a href="/countries/{{ item.id }}">View</a>
    </div>
{% endfor %}
<br />
<br />
<a href="/countries/new">New country</a>
</div>
{% endblock content %}
